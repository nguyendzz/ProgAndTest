{% extends "base.html" %}
{% block title %}Change Password - Student Manager System{% endblock %}
{% block content %}
<h1 style="margin-bottom: 20px;">Account Settings — Change Password</h1>
<div class="panel" style="max-width: 520px;">
    <form method="POST" action="{{ url_for('auth.change_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="current_password">Current Password</label>
            <input id="current_password" name="current_password" type="password" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="new_password">New Password (min 6 chars, letter & number)</label>
            <input id="new_password" name="new_password" type="password" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input id="confirm_password" name="confirm_password" type="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Update Password</button>
    </form>
</div>
{% endblock %}
